<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato - Comprar Maquininha</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f5f5;
    color:#333;
    min-height:100vh;
}

.container{
    max-width:800px;
    margin:50px auto;
    padding:20px;
}

.contact-box{
    background:#fff;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:15px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.contact-info{
    text-align:center;
    margin-bottom:30px;
}

.contact-info p{
    margin:10px 0;
    font-size:16px;
}

.contact-info a{
    color:#0066cc;
    text-decoration:none;
    font-weight:bold;
}

.whatsapp-btn{
    display:inline-block;
    margin-top:10px;
    background:#25D366;
    color:#fff !important;
    padding:12px 24px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.whatsapp-btn:hover{
    transform:translateY(-2px);
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    background:#0066cc;
    color:#fff;
    border:none;
    padding:14px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    opacity:.9;
}

.footer-note{
    margin-top:20px;
    text-align:center;
    color:#666;
    font-size:14px;
}

@media(max-width:768px){
    .container{
        margin:20px auto;
        padding:15px;
    }

    .contact-box{
        padding:25px;
    }

    h1{
        font-size:28px;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="contact-box">

        <h1>Entre em Contato</h1>

        <p class="subtitle">
            Ficou com alguma dúvida? Nossa equipe está à disposição para ajudar.
        </p>

        <div class="contact-info">

            <p>
                <strong>E-mail:</strong><br>
                <a href="mailto:contato@comprarmaquininha.org">
                    contato@comprarmaquininha.org
                </a>
            </p>

            <p>
                <strong>WhatsApp:</strong>
            </p>

            <a
                href="https://wa.me/5571993107035"
                target="_blank"
                class="whatsapp-btn">
                Falar pelo WhatsApp
            </a>

        </div>

        <form action="mailto:contato@comprarmaquininha.org" method="post" enctype="text/plain">

            <input
                type="text"
                name="Nome"
                placeholder="Seu nome"
                required>

            <input
                type="email"
                name="Email"
                placeholder="Seu e-mail"
                required>

            <input
                type="text"
                name="Assunto"
                placeholder="Assunto"
                required>

            <textarea
                name="Mensagem"
                placeholder="Digite sua mensagem..."
                required></textarea>

            <button type="submit">
                Enviar Mensagem
            </button>

        </form>

        <p class="footer-note">
            Você também pode entrar em contato diretamente pelo e-mail ou WhatsApp acima.
        </p>

    </div>
</div>

</body>
</html>
